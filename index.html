<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2年4組 予約・受付管理</title>
  <link rel="stylesheet" href="staff.css">

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>
  <header class="staff-header">
    <div class="header-main">
      <h1>2年4組 予約・受付管理</h1>
      <a href="monitor.html" target="_blank" class="monitor-link-btn">空き状況モニター</a>
    </div>
    <nav class="staff-tabs">
      <button type="button" class="tab-btn active" data-tab="tab-reserve">発券</button>
      <button type="button" class="tab-btn" data-tab="tab-scan">QR受付</button>
      <button type="button" class="tab-btn" data-tab="tab-board">予約一覧</button>
      <button type="button" class="tab-btn" data-tab="tab-settings">設定</button>
    </nav>
  </header>

  <main class="staff-main">
    <!-- ① 発券手続き -->
    <section id="tab-reserve" class="tab-content active">
      <h2>新規整理券 発券</h2>
      <form id="reservation-form">
        <div class="form-group">
          <label for="group-name">グループ名</label>
          <input type="text" id="group-name" required placeholder="代表者名またはグループ名">
        </div>

        <div class="form-group">
          <label>人数（最大4名）</label>
          <div class="keypad-input-display">
            <span id="pax-display">2</span>名
          </div>
          <div class="keypad-grid">
            <button type="button" class="key-btn" data-num="1">1</button>
            <button type="button" class="key-btn" data-num="2">2</button>
            <button type="button" class="key-btn" data-num="3">3</button>
            <button type="button" class="key-btn" data-num="4">4</button>
            <button type="button" class="key-btn clear" id="btn-clear-keypad">クリア</button>
          </div>
        </div>

        <div class="form-group">
          <label for="time-slot-input">案内時間（10分刻み）</label>
          <input type="text" id="time-slot-input" readonly required placeholder="タップして時刻を選択">
        </div>

        <div class="form-group">
          <label class="simple-checkbox-label">
            <input type="checkbox" id="is-repeat">
            <span class="custom-check-box"></span>
            <span class="check-text">再入場（2回目以降）</span>
          </label>
        </div>

        <button type="submit" class="btn primary-action">発券する</button>
      </form>
    </section>

    <!-- ② QRカメラ読取 -->
    <section id="tab-scan" class="tab-content">
      <h2>入場QR受付</h2>
      <div id="qr-reader-container">
        <div id="qr-reader"></div>
      </div>
      <div class="scanner-controls">
        <button type="button" id="btn-start-scan" class="btn success">カメラ起動</button>
        <button type="button" id="btn-stop-scan" class="btn danger" style="display:none;">停止</button>
      </div>
      <p id="scan-message" class="info-text">カメラを起動してください</p>
    </section>

    <!-- ③ 予約・案内一覧 -->
    <section id="tab-board" class="tab-content">
      <div class="board-header-bar">
        <h2>予約・案内一覧</h2>
        <div class="board-filter">
          <select id="board-filter-slot">
            <option value="all">すべての時間枠</option>
          </select>
        </div>
      </div>

      <div class="flight-board-container">
        <table class="flight-table">
          <thead>
            <tr>
              <th>時間</th>
              <th>グループ名</th>
              <th>人数</th>
              <th>区分</th>
              <th>状態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="flight-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- ④ 設定 -->
    <section id="tab-settings" class="tab-content">
      <h2>システム設定</h2>
      <form id="settings-form">
        <div class="form-group">
          <label for="setting-max-groups">1枠あたりの上限グループ数</label>
          <input type="number" id="setting-max-groups" min="1" max="10" required>
        </div>
        <div class="form-group inline-group">
          <div>
            <label for="setting-open-time">開始時刻</label>
            <input type="text" id="setting-open-time" placeholder="09:30" required>
          </div>
          <div>
            <label for="setting-close-time">終了時刻</label>
            <input type="text" id="setting-close-time" placeholder="15:00" required>
          </div>
        </div>
        <button type="submit" class="btn primary-action">保存</button>
      </form>
    </section>
  </main>

  <!-- Dual Dial Time Picker モーダル（レスポンシブスケール機構・×ボタン付） -->
  <div id="dial-modal" class="modal">
    <div class="modal-content dial-modal-content">
      <div class="modal-top-bar">
        <span class="modal-title-text">案内時刻を選択</span>
        <button type="button" class="btn-close-icon" id="btn-dial-close-x" aria-label="閉じる">×</button>
      </div>

      <!-- スケーリングラッパー：スマホ画面幅に合わせて縮小 -->
      <div class="tp-scale-wrapper" id="tpScaleWrapper">
        <div class="tp-container" id="timePicker">
          <!-- 左ダイヤル (時) -->
          <div class="tp-dial-wrapper tp-dial-left" id="hourDialWrap">
            <div class="tp-dial-plate" id="hourDial"></div>
            <span class="tp-label">時</span>
          </div>
          <div class="tp-pointer tp-pointer-left"></div>

          <!-- 中央パネル -->
          <div class="tp-center-panel">
            <div class="tp-header">
              <div class="tp-button-group">
                <button type="button" class="tp-mode-btn" id="btn12h">12時間</button>
                <button type="button" class="tp-mode-btn active" id="btn24h">24時間</button>
              </div>
              <div class="tp-button-group tp-ampm-group hidden" id="ampmGroup">
                <button type="button" class="tp-ampm-toggle-btn active" id="btnAM">午前</button>
                <button type="button" class="tp-ampm-toggle-btn" id="btnPM">午後</button>
              </div>
            </div>

            <div class="tp-time-display">
              <span class="tp-time-value" id="displayTime">09:30</span>
              <span class="tp-time-ampm" id="displayAmPm" style="display:none;"></span>
            </div>

            <div class="tp-precision-badge" id="minuteModeBadge">10分刻み</div>
          </div>

          <!-- 右ダイヤル (分: 10分刻み) -->
          <div class="tp-dial-wrapper tp-dial-right" id="minuteDialWrap">
            <div class="tp-dial-plate" id="minuteDial"></div>
            <span class="tp-label">分</span>
          </div>
          <div class="tp-pointer tp-pointer-right"></div>
        </div>
      </div>

      <div class="modal-actions-row">
        <button type="button" id="btn-dial-confirm" class="btn primary">決定</button>
        <button type="button" id="btn-dial-cancel" class="btn">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 発券QRモーダル -->
  <div id="qr-modal" class="modal">
    <div class="modal-content">
      <div class="modal-top-bar">
        <span class="modal-title-text">整理券QRコード</span>
        <button type="button" class="btn-close-icon" id="btn-qr-close-x" aria-label="閉じる">×</button>
      </div>
      <div id="modal-qrcode"></div>
      <p id="modal-ticket-url" class="ticket-url-text"></p>
      <button type="button" id="btn-close-qr-modal" class="btn">閉じる</button>
    </div>
  </div>

  <!-- 受付確認モーダル -->
  <div id="checkin-modal" class="modal">
    <div class="modal-content">
      <div class="modal-top-bar">
        <span class="modal-title-text">受付確認</span>
        <button type="button" class="btn-close-icon" id="btn-checkin-close-x" aria-label="閉じる">×</button>
      </div>
      <div id="checkin-details" class="details-box"></div>
      <div class="modal-actions-col">
        <button type="button" id="btn-confirm-checkin" class="btn success">受付を完了する</button>
        <button type="button" id="btn-cancel-checkin" class="btn">閉じる</button>
      </div>
    </div>
  </div>

  <script src="staff.js"></script>
</body>
</html>
