<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2年4組 空き状況モニター</title>
  <link rel="stylesheet" href="monitor.css">

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>
  <div class="monitor-container">
    <header class="monitor-header">
      <div class="header-left">
        <span class="class-tag">2年4組</span>
        <h1 class="header-title">空き状況</h1>
      </div>
      <div id="live-clock" class="live-clock">--:--:--</div>
    </header>

    <main class="monitor-main">
      <div id="slots-container" class="slots-board"></div>
    </main>

    <footer class="monitor-footer">
      <div class="legend-item"><span class="legend-badge available">空きあり</span></div>
      <div class="legend-item"><span class="legend-badge few">残り1組</span></div>
      <div class="legend-item"><span class="legend-badge full">満員</span></div>
    </footer>
  </div>

  <script src="monitor.js"></script>
</body>
</html>
